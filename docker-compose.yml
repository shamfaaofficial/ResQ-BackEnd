version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: resq-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: resq-platform
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - resq-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/resq-platform --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: resq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - resq-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resq-app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./resq-7cd08-firebase-adminsdk-fbsvc-78361eb6c6.json:/app/resq-7cd08-firebase-adminsdk-fbsvc-78361eb6c6.json:ro
    networks:
      - resq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  resq-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
